<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планировщик задач — Гант по неделям</title>
<style>
  :root{
    --week-px: 120px;
    --today-px: 0px;
    --total-px: 2000px;
    --left-w: 300px;
    --sub-left-w: 300px;
    --accent: #4f6bed;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e3e7f0;
    --text: #1e2330;
    --muted: #78829a;
    --c-roma:#3866d6; --c-masha:#e0862b; --c-ba:#22a06b; --c-bi:#e0c22b; --c-ik:#8e44ad; --c-def:#8a94a6;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;flex-direction:column;height:100vh;}
  .topbar{
    display:flex;align-items:center;gap:16px;padding:14px 20px;
    background:linear-gradient(135deg,#1b1f2e,#2b3252);color:#fff;flex:0 0 auto;flex-wrap:wrap;
  }
  .topbar .brand{font-size:18px;font-weight:700;letter-spacing:.2px;}
  .topbar .brand span{color:#8fa3ff;}
  .topbar .sub{font-size:12px;color:#b8c0d9;margin-left:4px;}
  .spacer{flex:1;}
  .legend{display:flex;gap:14px;font-size:12px;color:#c9d0e6;align-items:center;flex-wrap:wrap;}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
  .sync-status{font-size:11.5px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .sync-status.pending{background:#3a3f57;color:#ffd479;}
  .sync-status.ok{background:#1f4d38;color:#7ee787;}
  .sync-status.err{background:#4d1f1f;color:#ff9b9b;}
  .btn{
    border:1px solid var(--border);background:#fff;color:var(--text);padding:8px 14px;
    border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;
  }
  .btn:hover{background:#f0f2f8;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:#3c56d6;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.tiny{padding:3px 7px;font-size:11px;}
  .btn.danger{color:#c62828;border-color:#f0c4c4;}
  .btn.danger:hover{background:#fdeceb;}
  .btn.ghost{background:transparent;color:#e7ebff;border-color:#4a5378;}
  .btn.ghost:hover{background:rgba(255,255,255,.08);}
  .btn.subtle{background:#f0f2f8;border-color:#e3e7f0;color:#4f6bed;}
  .btn.subtle:hover{background:#e6ebff;}

  .board{flex:1;overflow:auto;position:relative;background:var(--card);}
  .row{display:flex;border-bottom:1px solid var(--border);min-height:44px;}
  .row.header-row{position:sticky;top:0;z-index:5;background:#fbfcff;border-bottom:2px solid var(--border);}
  .row.subrow{background:#fbfcfe;min-height:38px;}
  .row.subrow .left-cell{
    background:#fbfcfe;
    flex:0 0 var(--sub-left-w);
    width:var(--sub-left-w);
    padding:8px 14px;
    gap:2px;
  }
  .subrow-filler{
    position:sticky;
    left:var(--sub-left-w);
    z-index:3;
    flex:0 0 calc(var(--left-w) - var(--sub-left-w));
    width:calc(var(--left-w) - var(--sub-left-w));
    background:#fbfcfe;
    border-right:2px solid var(--border);
  }
  .left-cell{
    position:sticky;left:0;z-index:3;flex:0 0 var(--left-w);width:var(--left-w);
    background:#fff;border-right:2px solid var(--border);padding:10px 14px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
  }
  .row.header-row .left-cell{z-index:6;background:#fbfcff;justify-content:flex-end;font-weight:700;font-size:13px;color:var(--muted);}
  .task-title-row{display:flex;align-items:center;gap:6px;}
  .task-title-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex:0 0 auto;}
  .task-name{font-weight:700;font-size:14px;flex:1;}
  .task-name.sub{font-weight:600;font-size:13px;}
  .task-name.done{text-decoration:line-through;color:var(--muted);}
  .task-goal{font-size:11.5px;color:var(--muted);line-height:1.35;}
  .subrow .task-goal{font-size:10.5px;line-height:1.25;}
  .task-progress{font-size:11px;color:#3c56d6;font-weight:600;}
  .subrow .task-progress{font-size:10px;}
  .icon-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:5px;}
  .icon-btn:hover{background:#f0f2f8;color:#c62828;}
  .icon-btn.edit-btn:hover{color:#3c56d6;}
  .expand-toggle{border:none;background:#eef1fb;color:#4f6bed;cursor:pointer;font-size:11px;padding:2px 5px;border-radius:5px;flex:0 0 auto;font-weight:700;}
  .expand-toggle:hover{background:#e0e6fb;}
  .task-actions-row{display:flex;gap:6px;margin-top:2px;}
  .subrow .left-cell{padding-left:30px;border-left:3px solid #d7dcec;}

  .timeline-cell{
    position:relative;flex:0 0 var(--total-px);width:var(--total-px);
    background-image:
      linear-gradient(to right, transparent var(--today-px), #ff5252 var(--today-px), #ff5252 calc(var(--today-px) + 2px), transparent calc(var(--today-px) + 2px)),
      repeating-linear-gradient(to right, #edf0f7 0, #edf0f7 1px, transparent 1px, transparent var(--week-px));
    background-repeat:no-repeat, repeat;
  }
  .row.header-row .timeline-cell{background:transparent;display:flex;}
  .week-cell{
    flex:0 0 var(--week-px);width:var(--week-px);text-align:center;font-size:12px;
    color:var(--muted);padding:8px 0;border-right:1px solid var(--border);
  }
  .week-cell.current{color:#c62828;font-weight:800;background:#fff1f1;}
  .week-cell .dow{font-size:9.5px;color:#a7afc5;display:block;font-weight:400;}

  .stage-bar{
    position:absolute;height:24px;border-radius:5px;color:#fff;font-size:12px;
    display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;
    cursor:pointer;box-shadow:0 2px 5px rgba(20,25,40,.28);text-overflow:ellipsis;
    border:1.5px solid rgba(255,255,255,.55);
  }
  .stage-bar.done{opacity:.45;text-decoration:line-through;}
  .stage-bar:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 4px 10px rgba(20,25,40,.35);z-index:50 !important;}
  .stage-bar .mini-flag{margin-left:4px;font-size:10px;}
  .stage-bar.rollup{border-radius:6px;border:1.5px solid rgba(255,255,255,.6);font-weight:700;box-shadow:0 3px 8px rgba(35,45,65,.4);}
  .stage-bar.rollup::after{content:'▾';position:absolute;right:6px;font-size:9px;opacity:.9;}
  .stage-bar.rollup.done-sub{opacity:.5;text-decoration:line-through;}

  .empty-hint{padding:40px;text-align:center;color:var(--muted);font-size:13px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,38,.45);display:flex;
    align-items:center;justify-content:center;z-index:50;
  }
  .overlay.hidden{display:none;}
  .modal{
    background:#fff;border-radius:12px;padding:22px 24px;width:560px;max-width:92vw;
    max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3{margin:0 0 14px;font-size:17px;}
  .modal h4{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .modal .modal-note{font-size:12px;color:var(--muted);background:#f4f6fb;padding:8px 10px;border-radius:8px;margin-bottom:6px;}
  .modal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;}
  .modal input[type=text], .modal textarea, .modal input[type=date]{
    width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;
  }
  .modal textarea{resize:vertical;min-height:50px;}
  .stage-row{
    display:grid;grid-template-columns:1.4fr 1fr 0.85fr 0.85fr 30px;gap:6px;align-items:center;
    margin-bottom:8px;padding:8px;background:#f8f9fc;border-radius:8px;
  }
  .stage-row input{padding:6px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;width:100%;}
  .stage-row .rm{background:none;border:none;color:#c62828;cursor:pointer;font-size:16px;}
  .stage-row .hint-color{font-size:9.5px;color:#a7afc5;grid-column:1 / -1;margin-top:-4px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .field-hint{font-size:10.5px;color:#a7afc5;margin-top:2px;}

  /* Tooltip */
  .tooltip{
    position:fixed;z-index:100;background:#1e2330;color:#fff;padding:10px 12px;border-radius:8px;
    font-size:12px;line-height:1.5;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:260px;
  }
  .tooltip.hidden{display:none;}
  .tooltip b{color:#8fa3ff;}
  .tooltip .status-ok{color:#7ee787;font-weight:700;}
  .tooltip .status-pending{color:#ffd479;font-weight:700;}
  .tooltip .tt-muted{color:#9aa3bd;}

  /* Stage popup */
  .popup{
    position:fixed;z-index:110;background:#fff;border:1px solid var(--border);border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px 16px;width:300px;max-height:80vh;overflow-y:auto;font-size:13px;
  }
  .popup.hidden{display:none;}
  .popup.wide{width:520px;max-width:94vw;}
  .popup h4{margin:0 0 4px;font-size:14px;}
  .popup .sub{color:var(--muted);font-size:11.5px;margin-bottom:10px;}
  .popup label{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px;font-weight:600;}
  .popup input, .popup textarea{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:inherit;}
  .popup textarea{resize:vertical;min-height:54px;}
  .popup-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .popup-actions .btn{flex:1 1 auto;padding:6px 8px;font-size:12px;}
  .popup-close{position:absolute;top:8px;right:10px;background:none;border:none;font-size:15px;color:var(--muted);cursor:pointer;}
  .popup-section-title{
    margin:16px 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.4px;border-top:1px solid var(--border);padding-top:10px;
  }
  .popup-empty{font-size:11.5px;color:#a7afc5;font-style:italic;padding:2px 0 4px;}
  .popup-history{display:flex;flex-direction:column;gap:5px;max-height:110px;overflow-y:auto;}
  .hist-item{font-size:11.5px;background:#fff6e8;border:1px solid #f0dcb0;border-radius:6px;padding:5px 7px;color:#7a5b1a;}
  .hist-date{color:#a7894a;font-size:10px;}
  .popup-comments{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto;margin-bottom:8px;}
  .comment-item{background:#f4f6fb;border-radius:7px;padding:6px 8px;}
  .comment-text{font-size:12px;line-height:1.35;word-break:break-word;}
  .comment-date{font-size:10px;color:var(--muted);margin-top:2px;}
  .comment-add-row{display:flex;gap:6px;margin-top:4px;}
  .comment-add-row input{flex:1;}
  .comment-add-row .btn{padding:6px 10px;font-size:12px;flex:0 0 auto;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e2330;color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);
    z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ (только экраны до 700px, ПК не затрагивает) ===== */
  @media (max-width: 700px){
    :root{ --left-w: 168px; --sub-left-w: 168px; }
    .topbar{ padding:10px 12px; gap:8px; }
    .topbar .brand{ font-size:14px; }
    .topbar .sub{ display:none; }
    .legend{ order:5; width:100%; overflow-x:auto; white-space:nowrap; gap:8px; padding-bottom:2px; }
    .legend b{ display:none; }
    .sync-status{ font-size:10px; padding:3px 7px; }
    .btn{ padding:6px 9px; font-size:11.5px; }
    .btn.small{ padding:5px 8px; font-size:11px; }
    #exportBtn, #importBtn{ font-size:0; padding:6px 8px; }
    #exportBtn::before{ content:'⭳'; font-size:14px; }
    #importBtn::before{ content:'⭱'; font-size:14px; }

    .left-cell{ padding:6px 8px; gap:2px; }
    .row.subrow .left-cell{ padding:6px 8px; }
    .subrow .left-cell{ padding-left:16px; border-left-width:2px; }
    .task-name{ font-size:12px; }
    .task-name.sub{ font-size:11.5px; }
    .task-goal{ font-size:10px; line-height:1.25; }
    .subrow .task-goal{ font-size:9px; }
    .task-progress{ font-size:9.5px; }
    .task-actions-row{ flex-wrap:wrap; gap:4px; }
    .btn.tiny{ padding:3px 6px; font-size:10px; }
    .expand-toggle{ font-size:10px; padding:2px 4px; }

    .stage-bar{ font-size:10.5px; height:20px; padding:0 6px; }

    .modal{ width:96vw; padding:16px 14px; max-height:92vh; }
    .modal h3{ font-size:15px; }
    .stage-row{ grid-template-columns:1fr; gap:4px; }
    .stage-row .rm{ justify-self:end; }

    .popup{ width:92vw; max-width:92vw; }
    .popup.wide{ width:94vw; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">📋 Планировщик <span>задач · Гант</span></div>
    <div class="sub" id="todayLabel"></div>
    <span class="sync-status pending" id="syncStatus">Загрузка…</span>
    <div class="spacer"></div>
    <div class="legend" id="legend"></div>
    <button class="btn ghost small" id="refreshBtn" title="Подтянуть свежие данные с сервера">⟳ Обновить</button>
    <button class="btn ghost small" id="exportBtn" title="Скачать резервную копию в JSON-файл">⭳ Резервная копия</button>
    <button class="btn ghost small" id="importBtn" title="Загрузить данные из JSON-файла">⭱ Загрузить копию</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
    <button class="btn primary" id="addTaskBtn">+ Новая задача</button>
  </div>

  <div class="board" id="board">
    <div class="row header-row">
      <div class="left-cell">Задача / этапы · цель</div>
      <div class="timeline-cell" id="timelineHeader"></div>
    </div>
    <div id="taskRows"></div>
  </div>
</div>

<div class="overlay hidden" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Новая задача</h3>
    <div class="modal-note hidden" id="modalNote"></div>
    <label>Название</label>
    <input type="text" id="taskName" placeholder="Например: Запуск карточек товара">
    <label>Цель · бизнес-результат</label>
    <textarea id="taskGoal" placeholder="Например: рост конверсии на 15%, минус время менеджера..."></textarea>

    <h4>Этапы</h4>
    <div class="field-hint" style="margin:-4px 0 8px;">Цвет полосы назначается автоматически по ответственному (см. легенду в шапке)</div>
    <div id="stagesList"></div>
    <button class="btn small" id="addStageBtn">+ добавить этап</button>

    <div class="modal-actions">
      <button class="btn" id="cancelTaskBtn">Отмена</button>
      <button class="btn primary" id="saveTaskBtn">Сохранить</button>
    </div>
  </div>
</div>

<div class="tooltip hidden" id="tooltip"></div>
<div class="popup hidden" id="stagePopup"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const MS_DAY = 86400000;

  const OVERLAP_PX = 9;
  const BAR_HEIGHT = 24;

  // ==== Цвет по ответственному ====
  function colorFor(resp){
    if(!resp) return getCss('--c-def');
    const r = resp.trim();
    const words = r.split(/\s+/).map(w=>w.toUpperCase());
    if(words.includes('БА')) return getCss('--c-ba');
    if(words.includes('BI') || words.includes('БИ')) return getCss('--c-bi');
    if(/ром[а]?\s*ди/i.test(r)) return getCss('--c-roma');
    if(/маш[а]?\s*ди/i.test(r)) return getCss('--c-masha');
    if(/илья\s*копытов/i.test(r)) return getCss('--c-ik');
    return getCss('--c-def');
  }
  function getCss(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
  const SUBTASK_PALETTE = ['#4a5b72','#54687f','#5f7690','#6a84a0','#7592ae','#8aa0b8'];

  // ==== Google Sheets как хранилище ====
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdD-1OLL0GWMSRvqR6rQxXPZmyIKG1YZkz_RbHBJ-RWNbdp1QEYabItro31P19YKjJ/exec';
  const LOCAL_CACHE_KEY = 'gantt_planner_cache_v8';

  function todayMidnight(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
  function mondayOf(d){
    const dt = new Date(d); const day = dt.getDay();
    const diff = (day===0? -6 : 1-day);
    dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0);
    return dt;
  }
  function addDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt; }
  function daysBetween(a,b){ return Math.round((b-a)/MS_DAY); }
  function parseDate(s){ return new Date(s+'T00:00:00'); }
  function fmtISO(d){ return d.toISOString().slice(0,10); }
  const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  function fmtShort(d){ return d.getDate()+' '+MONTHS[d.getMonth()]; }
  function nowTimeStr(){ const d=new Date(); return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }

  const TODAY = todayMidnight();
  const VIEW_START = addDays(mondayOf(TODAY), -14);
  const WEEKS_COUNT = 22;
  const WEEK_PX = 120;
  const DAY_PX = WEEK_PX/7;
  const TOTAL_PX = WEEKS_COUNT*WEEK_PX;
  const TODAY_PX = daysBetween(VIEW_START, TODAY)*DAY_PX;

  document.documentElement.style.setProperty('--week-px', WEEK_PX+'px');
  document.documentElement.style.setProperty('--today-px', TODAY_PX+'px');
  document.documentElement.style.setProperty('--total-px', TOTAL_PX+'px');

  document.getElementById('todayLabel').textContent = 'Сегодня: '+fmtShort(TODAY)+' · '+TODAY.getFullYear();

  let toastTimer = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2600);
  }

  function setSyncStatus(text, cls){
    const el = document.getElementById('syncStatus');
    if(!el) return;
    el.textContent = text;
    el.className = 'sync-status '+cls;
  }

  function stg(id,name,responsible,start,end,done){
    return {id, name, responsible, start, end, done: !!done, comments:[], history:[]};
  }

  function seedData(){ return []; }

  function normalizeStage(stage){
    if(!Array.isArray(stage.comments)) stage.comments = [];
    if(!Array.isArray(stage.history)) stage.history = [];
    return stage;
  }
  function normalizeSubtask(sub){
    if(!Array.isArray(sub.stages)) sub.stages = [];
    sub.stages.forEach(normalizeStage);
    if(typeof sub.done !== 'boolean') sub.done = false;
    if(typeof sub.goal !== 'string') sub.goal = '';
    return sub;
  }
  function normalizeTask(t){
    if(!Array.isArray(t.stages)) t.stages = [];
    t.stages.forEach(normalizeStage);
    if(!Array.isArray(t.subtasks)) t.subtasks = [];
    t.subtasks.forEach(normalizeSubtask);
    if(typeof t.expanded !== 'boolean') t.expanded = true;
    return t;
  }
  function normalizeData(data){
    data.forEach(normalizeTask);
    return data;
  }

  let DATA = [];
  let saveTimer = null;

  function saveData(data){
    DATA = data;
    try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data)); }catch(e){}
    setSyncStatus('Сохранение…', 'pending');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ pushToServer(data); }, 500);
  }

  async function pushToServer(data){
    try{
      const resp = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({tasks: data})
      });
      if(!resp.ok) throw new Error('bad status '+resp.status);
      setSyncStatus('Сохранено ✓ '+nowTimeStr(), 'ok');
    }catch(err){
      setSyncStatus('Ошибка сохранения — проверьте связь', 'err');
    }
  }

  async function fetchFromServer(){
    const resp = await fetch(SCRIPT_URL, {method:'GET'});
    if(!resp.ok) throw new Error('bad status '+resp.status);
    return await resp.json();
  }

  async function initialLoad(){
    setSyncStatus('Загрузка данных…', 'pending');
    try{
      const json = await fetchFromServer();
      let tasks = Array.isArray(json.tasks) ? json.tasks : [];
      if(tasks.length === 0){
        tasks = seedData();
        normalizeData(tasks);
        DATA = tasks;
        try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(DATA)); }catch(e){}
        pushToServer(DATA);
      } else {
        normalizeData(tasks);
        DATA = tasks;
        setSyncStatus('Синхронизировано ✓', 'ok');
      }
    }catch(err){
      let cached = null;
      try{ cached = JSON.parse(localStorage.getItem(LOCAL_CACHE_KEY)); }catch(e){}
      DATA = Array.isArray(cached) ? normalizeData(cached) : normalizeData(seedData());
      setSyncStatus('Нет связи с сервером — офлайн-копия', 'err');
    }
    render();
  }

  async function manualRefresh(){
    setSyncStatus('Обновление…', 'pending');
    try{
      const json = await fetchFromServer();
      if(Array.isArray(json.tasks)){
        DATA = normalizeData(json.tasks);
        try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(DATA)); }catch(e){}
        render();
      }
      setSyncStatus('Обновлено ✓ '+nowTimeStr(), 'ok');
    }catch(err){
      setSyncStatus('Не удалось обновить — проверьте связь', 'err');
    }
  }
  document.getElementById('refreshBtn').addEventListener('click', manualRefresh);

  setInterval(async ()=>{
    const modalOpen = !document.getElementById('modalOverlay').classList.contains('hidden');
    const popupOpen = !document.getElementById('stagePopup').classList.contains('hidden');
    if(modalOpen || popupOpen) return;
    try{
      const json = await fetchFromServer();
      if(Array.isArray(json.tasks) && json.tasks.length){
        DATA = normalizeData(json.tasks);
        try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(DATA)); }catch(e){}
        render();
        setSyncStatus('Синхронизировано ✓ '+nowTimeStr(), 'ok');
      }
    }catch(e){ }
  }, 25000);

  function exportData(){
    const payload = {
      type: 'gantt_planner_export',
      version: 3,
      exportedAt: new Date().toISOString(),
      tasks: DATA
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = fmtISO(TODAY);
    a.href = url;
    a.download = 'планировщик_данные_'+stamp+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Резервная копия скачана');
  }

  function validateTasks(tasks){
    if(!Array.isArray(tasks)) return false;
    return tasks.every(t => t && typeof t.id!=='undefined' && typeof t.name==='string' && Array.isArray(t.stages||[]));
  }

  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = function(ev){
      let parsed;
      try{
        parsed = JSON.parse(ev.target.result);
      }catch(e){
        alert('Не удалось прочитать файл: это не корректный JSON.');
        return;
      }
      const tasks = Array.isArray(parsed) ? parsed : parsed.tasks;
      if(!validateTasks(tasks)){
        alert('Файл не похож на выгрузку из этого планировщика.');
        return;
      }
      normalizeData(tasks);
      const mode = tasks.length && DATA.length
        ? confirm('Заменить текущие задачи загруженными?\n\nОК — заменить всё.\nОтмена — добавить загруженные задачи к текущим.')
        : true;
      if(mode){
        DATA = tasks;
      } else {
        const existingIds = new Set(DATA.map(t=>t.id));
        tasks.forEach(t=>{
          if(existingIds.has(t.id)) t.id = 't'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
        });
        DATA = DATA.concat(tasks);
      }
      saveData(DATA);
      render();
      showToast('Данные загружены: '+tasks.length+' задач(и), отправляем на сервер…');
    };
    reader.readAsText(file);
  }

  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(file) importDataFromFile(file);
    e.target.value = '';
  });

  function renderHeader(){
    const el = document.getElementById('timelineHeader');
    el.innerHTML = '';
    for(let i=0;i<WEEKS_COUNT;i++){
      const ws = addDays(VIEW_START, i*7);
      const isCurrent = TODAY >= ws && TODAY < addDays(ws,7);
      const div = document.createElement('div');
      div.className = 'week-cell'+(isCurrent?' current':'');
      div.innerHTML = fmtShort(ws) + (isCurrent? '<span class="dow">тек. неделя</span>':'');
      el.appendChild(div);
    }
  }

  function renderLegend(){
    const el = document.getElementById('legend');
    el.innerHTML =
      '<b style="color:#fff;">Цвета по ответственному:</b>' +
      '<span><span class="dot" style="background:'+getCss('--c-roma')+'"></span>Рома ДИ</span>' +
      '<span><span class="dot" style="background:'+getCss('--c-masha')+'"></span>Маша ДИ</span>' +
      '<span><span class="dot" style="background:'+getCss('--c-ba')+'"></span>БА</span>' +
      '<span><span class="dot" style="background:'+getCss('--c-bi')+'"></span>BI</span>' +
      '<span><span class="dot" style="background:'+getCss('--c-ik')+'"></span>Илья Копытов</span>' +
      '<span><span class="dot" style="background:#ff5252"></span>сегодня</span>' +
      '<span><span class="dot" style="background:#5f7690"></span>подзадача (сводка)</span>';
  }

  function escapeHtml(str){
    const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML;
  }
  function stageProgressStages(stages){
    if(!stages || !stages.length) return null;
    const done = stages.filter(s=>s.done).length;
    return done+' / '+stages.length+' этапов завершено';
  }
  function stageProgress(task){
    if(task.subtasks && task.subtasks.length){
      const allStages = task.subtasks.reduce((acc,s)=>acc.concat(s.stages),[]);
      const doneSub = task.subtasks.filter(s=>s.done).length;
      const prog = stageProgressStages(allStages);
      return doneSub+' / '+task.subtasks.length+' подзадач'+(prog? ' · '+prog : '');
    }
    return stageProgressStages(task.stages) || '';
  }
  function subtaskSpan(sub){
    if(!sub.stages.length) return null;
    let minStart = null, maxEnd = null;
    sub.stages.forEach(s=>{
      const st = parseDate(s.start), en = parseDate(s.end);
      if(minStart===null || st < minStart) minStart = st;
      if(maxEnd===null || en > maxEnd) maxEnd = en;
    });
    return {start:minStart, end:maxEnd};
  }
  function subtaskEarliestStartTime(sub){
    if(!sub.stages || !sub.stages.length) return Infinity;
    return Math.min(...sub.stages.map(s=>parseDate(s.start).getTime()));
  }
  function allDoneCheck(stages){ return stages && stages.length>0 && stages.every(s=>s.done); }
  function barsFor(hasSub, task, sub){
    return hasSub ? task.subtasks.length : (sub? sub.stages.length : task.stages.length);
  }
  function overlapRowHeight(barsCount, compact){
    if(!barsCount) return compact ? 40 : 58;
    const base = compact ? 8 : 12;
    const bottom = compact ? 10 : 16;
    const needed = base + (barsCount-1)*OVERLAP_PX + BAR_HEIGHT + bottom;
    return Math.max(compact ? 40 : 58, needed);
  }

  function buildStageBars(tl, stages, ownerLabelFn, stagesArrayRef, topBase){
    const base = topBase!=null? topBase : 10;
    stages.forEach((stage, idx)=>{
      normalizeStage(stage);
      const sStart = parseDate(stage.start);
      const sEnd = parseDate(stage.end);
      let leftPx = daysBetween(VIEW_START, sStart)*DAY_PX;
      let widthPx = (daysBetween(sStart, sEnd)+1)*DAY_PX;
      if(widthPx < 10) widthPx = 10;
      const bar = document.createElement('div');
      bar.className = 'stage-bar'+(stage.done?' done':'');
      bar.style.left = leftPx+'px';
      bar.style.top = (base+idx*OVERLAP_PX)+'px';
      bar.style.width = widthPx+'px';
      bar.style.height = BAR_HEIGHT+'px';
      bar.style.background = colorFor(stage.responsible);
      bar.style.zIndex = String(idx+1);
      bar.innerHTML = escapeHtml(stage.name) +
        (stage.history.length? '<span class="mini-flag" title="Перенос дедлайна">↻</span>':'') +
        (stage.comments.length? '<span class="mini-flag" title="Есть комментарии">💬</span>':'');
      bar.addEventListener('mouseenter', (e)=>showTooltip(e, ownerLabelFn(), stage));
      bar.addEventListener('mousemove', moveTooltip);
      bar.addEventListener('mouseleave', hideTooltip);
      bar.addEventListener('click', (e)=>{ hideTooltip(); openStagePopup(e, ownerLabelFn(), stagesArrayRef, stage); });
      tl.appendChild(bar);
    });
  }

  function buildRollupBars(tl, task){
    task.subtasks.forEach((sub, idx)=>{
      const span = subtaskSpan(sub);
      if(!span) return;
      let leftPx = daysBetween(VIEW_START, span.start)*DAY_PX;
      let widthPx = (daysBetween(span.start, span.end)+1)*DAY_PX;
      if(widthPx < 10) widthPx = 10;
      const bar = document.createElement('div');
      const color = SUBTASK_PALETTE[idx % SUBTASK_PALETTE.length];
      const allDone = allDoneCheck(sub.stages);
      bar.className = 'stage-bar rollup'+(allDone?' done-sub':'');
      bar.style.left = leftPx+'px';
      bar.style.top = (10+idx*OVERLAP_PX)+'px';
      bar.style.width = widthPx+'px';
      bar.style.height = BAR_HEIGHT+'px';
      bar.style.background = color;
      bar.style.zIndex = String(idx+1);
      bar.style.paddingRight = '18px';
      const done = sub.stages.filter(s=>s.done).length;
      bar.innerHTML = escapeHtml(sub.name)+' <span class="mini-flag">'+done+'/'+sub.stages.length+'</span>';
      bar.addEventListener('mouseenter', (e)=>showRollupTooltip(e, task, sub, span));
      bar.addEventListener('mousemove', moveTooltip);
      bar.addEventListener('mouseleave', hideTooltip);
      bar.addEventListener('click', (e)=>{
        e.stopPropagation();
        task.expanded = true;
        saveData(DATA); render();
      });
      tl.appendChild(bar);
    });
  }

  function renderRows(){
    const container = document.getElementById('taskRows');
    container.innerHTML = '';
    if(DATA.length===0){
      container.innerHTML = '<div class="empty-hint">Пока нет задач. Нажмите «+ Новая задача», чтобы добавить первую.</div>';
      return;
    }
    DATA.forEach(task=>{
      const hasSub = task.subtasks && task.subtasks.length>0;
      if(hasSub){
        task.subtasks.sort((a,b)=> subtaskEarliestStartTime(a) - subtaskEarliestStartTime(b));
      }
      const barsCount = hasSub ? task.subtasks.length : task.stages.length;
      const rowHeight = overlapRowHeight(barsCount, false);

      const row = document.createElement('div');
      row.className = 'row';
      row.style.minHeight = rowHeight+'px';

      const left = document.createElement('div');
      left.className = 'left-cell';
      const expandBtn = hasSub ? `<button class="expand-toggle" data-action="toggle-expand" data-task="${task.id}">${task.expanded?'▾ свернуть':'▸ развернуть'} (${task.subtasks.length})</button>` : '';
      left.innerHTML = `
        <div class="task-title-row">
          <input type="checkbox" ${task.done?'checked':''} data-action="toggle-task" data-task="${task.id}">
          <div class="task-name ${task.done?'done':''}">${escapeHtml(task.name)}</div>
          <button class="icon-btn edit-btn" data-action="edit-task" data-task="${task.id}" title="Редактировать название/цель/этапы">✎</button>
          <button class="icon-btn" data-action="delete-task" data-task="${task.id}" title="Удалить задачу">✕</button>
        </div>
        <div class="task-goal">🎯 ${escapeHtml(task.goal||'—')}</div>
        <div class="task-progress">${stageProgress(task)}</div>
        <div class="task-actions-row">
          <button class="btn tiny subtle" data-action="add-subtask" data-task="${task.id}">＋ Подзадача</button>
          ${expandBtn}
        </div>
      `;
      row.appendChild(left);

      const tl = document.createElement('div');
      tl.className = 'timeline-cell';
      tl.style.height = rowHeight+'px';

      if(hasSub){
        buildRollupBars(tl, task);
      } else {
        buildStageBars(tl, task.stages, ()=>task.name, task.stages, 10);
      }

      row.appendChild(tl);
      container.appendChild(row);

      if(hasSub && task.expanded){
        task.subtasks.forEach(sub=>{
          normalizeSubtask(sub);
          const subHeight = overlapRowHeight(sub.stages.length, true);
          const subRow = document.createElement('div');
          subRow.className = 'row subrow';
          subRow.style.minHeight = subHeight+'px';

          const subLeft = document.createElement('div');
          subLeft.className = 'left-cell';
          const allDone = allDoneCheck(sub.stages);
          subLeft.innerHTML = `
            <div class="task-title-row">
              <input type="checkbox" ${sub.done?'checked':''} data-action="toggle-subtask" data-task="${task.id}" data-subtask="${sub.id}">
              <div class="task-name sub ${(sub.done||allDone)?'done':''}">↳ ${escapeHtml(sub.name)}</div>
              <button class="icon-btn edit-btn" data-action="edit-subtask" data-task="${task.id}" data-subtask="${sub.id}" title="Редактировать название/описание/этапы">✎</button>
              <button class="icon-btn" data-action="delete-subtask" data-task="${task.id}" data-subtask="${sub.id}" title="Удалить подзадачу">✕</button>
            </div>
            <div class="task-goal">🎯 ${escapeHtml(sub.goal||'—')}</div>
            <div class="task-progress">${stageProgressStages(sub.stages)||'нет этапов'}</div>
          `;
          subRow.appendChild(subLeft);

          const filler = document.createElement('div');
          filler.className = 'subrow-filler';
          filler.style.height = subHeight+'px';
          subRow.appendChild(filler);

          const subTl = document.createElement('div');
          subTl.className = 'timeline-cell';
          subTl.style.height = subHeight+'px';
          buildStageBars(subTl, sub.stages, ()=>task.name+' › '+sub.name, sub.stages, 7);
          subRow.appendChild(subTl);

          container.appendChild(subRow);
        });
      }
    });
  }

  function render(){
    renderHeader();
    renderLegend();
    renderRows();
  }

  const tooltipEl = document.getElementById('tooltip');
  function showTooltip(e, ownerLabel, stage){
    const statusHtml = stage.done
      ? '<span class="status-ok">✔ завершено</span>'
      : '<span class="status-pending">в работе</span>';
    const transferHtml = stage.history.length
      ? `<div class="tt-muted">Перенесён: ${stage.history.length} раз(а)</div>`
      : '';
    const commentsHtml = stage.comments.length
      ? `<div class="tt-muted">Комментариев: ${stage.comments.length}</div>`
      : '';
    tooltipEl.innerHTML = `
      <div><b>${escapeHtml(ownerLabel)}</b></div>
      <div style="margin:4px 0 6px;font-weight:700;">${escapeHtml(stage.name)}</div>
      <div>Ответственный: ${escapeHtml(stage.responsible||'—')}</div>
      <div>Срок: ${fmtShort(parseDate(stage.start))} – ${fmtShort(parseDate(stage.end))}</div>
      <div>Статус: ${statusHtml}</div>
      ${transferHtml}
      ${commentsHtml}
    `;
    tooltipEl.classList.remove('hidden');
    moveTooltip(e);
  }
  function showRollupTooltip(e, task, sub, span){
    const done = sub.stages.filter(s=>s.done).length;
    tooltipEl.innerHTML = `
      <div><b>${escapeHtml(task.name)}</b></div>
      <div style="margin:4px 0 6px;font-weight:700;">Подзадача: ${escapeHtml(sub.name)}</div>
      <div>Срок (по всем этапам): ${fmtShort(span.start)} – ${fmtShort(span.end)}</div>
      <div>Прогресс: ${done}/${sub.stages.length} этапов</div>
      <div class="tt-muted">Клик — развернуть подзадачи</div>
    `;
    tooltipEl.classList.remove('hidden');
    moveTooltip(e);
  }
  function moveTooltip(e){
    let x = e.clientX + 16, y = e.clientY + 16;
    const rect = tooltipEl.getBoundingClientRect();
    if(x + rect.width > window.innerWidth) x = e.clientX - rect.width - 16;
    if(y + rect.height > window.innerHeight) y = e.clientY - rect.height - 16;
    tooltipEl.style.left = x+'px';
    tooltipEl.style.top = y+'px';
  }
  function hideTooltip(){ tooltipEl.classList.add('hidden'); }

  const popupEl = document.getElementById('stagePopup');
  function positionPopup(e, estHeight, width){
    const w = width || 300;
    let x = e.clientX, y = e.clientY + 12;
    if(x + w + 10 > window.innerWidth) x = window.innerWidth - (w+20);
    if(y + estHeight > window.innerHeight) y = Math.max(8, window.innerHeight - (estHeight+10));
    popupEl.style.left = Math.max(8,x)+'px';
    popupEl.style.top = Math.max(8,y)+'px';
  }
  function openStagePopup(e, ownerLabel, stagesArrayRef, stage){
    normalizeStage(stage);
    popupEl.classList.remove('wide');

    const historyHtml = stage.history.length
      ? '<div class="popup-history">' + stage.history.slice().reverse().map(h=>
          `<div class="hist-item">📅 ${fmtShort(parseDate(h.from))} → ${fmtShort(parseDate(h.to))}<br><span class="hist-date">перенесено ${fmtShort(parseDate(h.changedAt))}</span></div>`
        ).join('') + '</div>'
      : '<div class="popup-empty">Переносов дедлайна не было</div>';

    const commentsHtml = stage.comments.length
      ? '<div class="popup-comments">' + stage.comments.slice().reverse().map(c=>
          `<div class="comment-item"><div class="comment-text">${escapeHtml(c.text)}</div><div class="comment-date">${fmtShort(parseDate(c.date))}</div></div>`
        ).join('') + '</div>'
      : '<div class="popup-empty">Комментариев пока нет</div>';

    popupEl.innerHTML = `
      <button class="popup-close" id="popupCloseBtn">✕</button>
      <h4>${escapeHtml(stage.name)}</h4>
      <div class="sub">${escapeHtml(ownerLabel)}</div>
      <label>Ответственный</label>
      <input type="text" id="popResp" value="${escapeHtml(stage.responsible||'')}">
      <label>Дедлайн (дата окончания)</label>
      <input type="date" id="popDeadline" value="${stage.end}">
      <div class="popup-actions">
        <button class="btn small primary" id="popSaveBtn">Сохранить</button>
        <button class="btn small" id="popDoneBtn">${stage.done?'Вернуть в работу':'Завершить этап'}</button>
        <button class="btn small danger" id="popDelBtn">Удалить этап</button>
      </div>

      <div class="popup-section-title">История переносов дедлайна</div>
      ${historyHtml}

      <div class="popup-section-title">Комментарии</div>
      ${commentsHtml}
      <div class="comment-add-row">
        <input type="text" id="popNewComment" placeholder="Добавить комментарий...">
        <button class="btn small primary" id="popAddCommentBtn">+</button>
      </div>
    `;
    popupEl.classList.remove('hidden');
    positionPopup(e, 420, 300);

    document.getElementById('popupCloseBtn').onclick = closeStagePopup;
    document.getElementById('popSaveBtn').onclick = ()=>{
      stage.responsible = document.getElementById('popResp').value.trim();
      const nd = document.getElementById('popDeadline').value;
      if(nd && nd !== stage.end){
        stage.history.push({from: stage.end, to: nd, changedAt: fmtISO(TODAY)});
        stage.end = nd;
      }
      saveData(DATA); render(); closeStagePopup();
      showToast('Изменения сохранены');
    };
    document.getElementById('popDoneBtn').onclick = ()=>{
      stage.done = !stage.done;
      saveData(DATA); render(); closeStagePopup();
    };
    document.getElementById('popDelBtn').onclick = ()=>{
      const idx = stagesArrayRef.indexOf(stage);
      if(idx>-1) stagesArrayRef.splice(idx,1);
      saveData(DATA); render(); closeStagePopup();
    };
    document.getElementById('popAddCommentBtn').onclick = ()=>{
      const input = document.getElementById('popNewComment');
      const text = input.value.trim();
      if(!text) return;
      stage.comments.push({text, date: fmtISO(TODAY)});
      saveData(DATA);
      render();
      openStagePopup(e, ownerLabel, stagesArrayRef, stage);
    };
    document.getElementById('popNewComment').addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){ document.getElementById('popAddCommentBtn').click(); }
    });
  }

  function addPopupStageRow(container, prefill, boundList){
    const row = document.createElement('div');
    row.className = 'stage-row';
    const start = (prefill && prefill.start) || fmtISO(TODAY);
    const end = (prefill && prefill.end) || fmtISO(addDays(TODAY,7));
    row.innerHTML = `
      <input type="text" placeholder="Название этапа" class="s-name" value="${prefill? escapeHtml(prefill.name):''}">
      <input type="text" placeholder="Ответственный" class="s-resp" value="${prefill? escapeHtml(prefill.responsible):''}">
      <input type="date" class="s-start" value="${start}">
      <input type="date" class="s-end" value="${end}">
      <button class="rm" title="Удалить этап">✕</button>
    `;
    const binding = {row, existing: prefill || null};
    row.querySelector('.rm').addEventListener('click', ()=>{
      row.remove();
      const idx = boundList.indexOf(binding);
      if(idx>-1) boundList.splice(idx,1);
    });
    boundList.push(binding);
    container.appendChild(row);
  }

  function openInfoEditPopup(e, opts){
    const stageBindings = [];
    const hasStages = Array.isArray(opts.stagesRef);

    const stagesSectionHtml = hasStages ? `
      <div class="popup-section-title" style="margin-top:14px;">Этапы</div>
      <div class="field-hint" style="margin:0 0 6px;">Цвет — по ответственному (см. легенду в шапке)</div>
      <div id="popStagesList"></div>
      <button class="btn tiny subtle" id="popAddStageBtn" style="margin-top:4px;">+ добавить этап</button>
    ` : (opts.stagesNote ? `<div class="modal-note" style="margin-top:12px;">${escapeHtml(opts.stagesNote)}</div>` : '');

    popupEl.classList.toggle('wide', hasStages);
    popupEl.innerHTML = `
      <button class="popup-close" id="editCloseBtn">✕</button>
      <h4>${escapeHtml(opts.title)}</h4>
      <label>Название</label>
      <input type="text" id="editNameInput" value="${escapeHtml(opts.nameVal||'')}">
      <label>Цель / описание</label>
      <textarea id="editGoalInput">${escapeHtml(opts.goalVal||'')}</textarea>
      ${stagesSectionHtml}
      <div class="popup-actions">
        <button class="btn small primary" id="editSaveBtn">Сохранить</button>
        <button class="btn small" id="editCancelBtn">Отмена</button>
      </div>
    `;
    popupEl.classList.remove('hidden');
    positionPopup(e, hasStages ? 480 : 230, hasStages ? 520 : 300);

    if(hasStages){
      const list = document.getElementById('popStagesList');
      opts.stagesRef.forEach(stage=> addPopupStageRow(list, stage, stageBindings));
      document.getElementById('popAddStageBtn').addEventListener('click', ()=> addPopupStageRow(list, null, stageBindings));
    }

    document.getElementById('editCloseBtn').onclick = closeStagePopup;
    document.getElementById('editCancelBtn').onclick = closeStagePopup;
    document.getElementById('editSaveBtn').onclick = ()=>{
      const newName = document.getElementById('editNameInput').value.trim();
      const newGoal = document.getElementById('editGoalInput').value.trim();
      if(!newName){ alert('Название не может быть пустым'); return; }

      if(hasStages){
        const finalStages = [];
        for(const binding of stageBindings){
          if(!binding.row.isConnected) continue;
          const sName = binding.row.querySelector('.s-name').value.trim();
          if(!sName) continue;
          const sResp = binding.row.querySelector('.s-resp').value.trim();
          const sStart = binding.row.querySelector('.s-start').value;
          const sEnd = binding.row.querySelector('.s-end').value;
          if(parseDate(sEnd) < parseDate(sStart)){
            alert('У этапа "'+sName+'" дата окончания раньше начала — проверьте даты.');
            return;
          }
          if(binding.existing){
            binding.existing.name = sName;
            binding.existing.responsible = sResp;
            binding.existing.start = sStart;
            binding.existing.end = sEnd;
            finalStages.push(binding.existing);
          } else {
            finalStages.push({
              id:'s'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
              name:sName, responsible:sResp, start:sStart, end:sEnd,
              done:false, comments:[], history:[]
            });
          }
        }
        opts.stagesRef.length = 0;
        opts.stagesRef.push(...finalStages);
      }

      opts.onSave(newName, newGoal);
      saveData(DATA); render(); closeStagePopup();
      showToast('Изменения сохранены');
    };
  }
  function closeStagePopup(){ popupEl.classList.add('hidden'); popupEl.classList.remove('wide'); }

  document.addEventListener('click', (e)=>{
    if(!popupEl.contains(e.target) && !e.target.closest('.stage-bar') && !e.target.closest('.edit-btn')){
      closeStagePopup();
    }
  });

  document.getElementById('taskRows').addEventListener('click', (e)=>{
    const t = e.target;
    const action = t.dataset.action;
    if(!action) return;
    const task = DATA.find(x=>x.id===t.dataset.task);
    if(action==='toggle-task'){
      task.done = t.checked;
      saveData(DATA); render();
    }
    if(action==='delete-task'){
      if(confirm('Удалить задачу и все её этапы/подзадачи?')){
        DATA = DATA.filter(x=>x.id!==t.dataset.task);
        saveData(DATA); render();
      }
    }
    if(action==='edit-task'){
      e.stopPropagation();
      const hasSub = task.subtasks && task.subtasks.length>0;
      openInfoEditPopup(e, {
        title:'Редактировать задачу',
        nameVal: task.name,
        goalVal: task.goal||'',
        stagesRef: hasSub ? null : task.stages,
        stagesNote: hasSub ? 'У задачи есть подзадачи — таймлайн строится из их этапов. Чтобы добавить/изменить этапы, отредактируйте нужную подзадачу.' : null,
        onSave:(n,g)=>{ task.name=n; task.goal=g; }
      });
    }
    if(action==='toggle-expand'){
      task.expanded = !task.expanded;
      saveData(DATA); render();
    }
    if(action==='add-subtask'){
      openTaskModal('subtask', task.id);
    }
    if(action==='toggle-subtask'){
      const sub = task.subtasks.find(s=>s.id===t.dataset.subtask);
      sub.done = t.checked;
      saveData(DATA); render();
    }
    if(action==='edit-subtask'){
      e.stopPropagation();
      const sub = task.subtasks.find(s=>s.id===t.dataset.subtask);
      openInfoEditPopup(e, {
        title:'Редактировать подзадачу',
        nameVal: sub.name,
        goalVal: sub.goal||'',
        stagesRef: sub.stages,
        onSave:(n,g)=>{ sub.name=n; sub.goal=g; }
      });
    }
    if(action==='delete-subtask'){
      if(confirm('Удалить эту подзадачу и её этапы?')){
        task.subtasks = task.subtasks.filter(s=>s.id!==t.dataset.subtask);
        saveData(DATA); render();
      }
    }
  });

  const overlay = document.getElementById('modalOverlay');
  const stagesList = document.getElementById('stagesList');
  const modalTitleEl = document.getElementById('modalTitle');
  const modalNoteEl = document.getElementById('modalNote');
  let modalMode = 'task';
  let modalParentTaskId = null;

  function addStageRow(prefill){
    const start = (prefill && prefill.start) || fmtISO(TODAY);
    const end = (prefill && prefill.end) || fmtISO(addDays(TODAY,7));
    const row = document.createElement('div');
    row.className = 'stage-row';
    row.innerHTML = `
      <input type="text" placeholder="Название этапа" class="s-name" value="${prefill? escapeHtml(prefill.name):''}">
      <input type="text" placeholder="Ответственный" class="s-resp" value="${prefill? escapeHtml(prefill.responsible):''}">
      <input type="date" class="s-start" value="${start}">
      <input type="date" class="s-end" value="${end}">
      <button class="rm" title="Удалить этап">✕</button>
    `;
    row.querySelector('.rm').addEventListener('click', ()=> row.remove());
    stagesList.appendChild(row);
  }

  document.getElementById('addStageBtn').addEventListener('click', ()=> addStageRow());

  function openTaskModal(mode, parentTaskId){
    modalMode = mode;
    modalParentTaskId = parentTaskId || null;
    document.getElementById('taskName').value = '';
    document.getElementById('taskGoal').value = '';
    stagesList.innerHTML = '';
    addStageRow();
    if(mode==='subtask'){
      const parent = DATA.find(x=>x.id===parentTaskId);
      modalTitleEl.textContent = 'Новая подзадача для «'+parent.name+'»';
      modalNoteEl.textContent = 'Как только вы сохраните подзадачу, таймлайн задачи «'+parent.name+'» перестанет показывать собственную ленту и станет сводкой по подзадачам — раскрыть можно кнопкой «развернуть».';
      modalNoteEl.classList.remove('hidden');
    } else {
      modalTitleEl.textContent = 'Новая задача';
      modalNoteEl.classList.add('hidden');
    }
    overlay.classList.remove('hidden');
  }

  document.getElementById('addTaskBtn').addEventListener('click', ()=> openTaskModal('task', null));
  document.getElementById('cancelTaskBtn').addEventListener('click', ()=> overlay.classList.add('hidden'));

  document.getElementById('saveTaskBtn').addEventListener('click', ()=>{
    const name = document.getElementById('taskName').value.trim();
    if(!name){ alert('Укажите название'); return; }
    const goal = document.getElementById('taskGoal').value.trim();
    const stages = [];
    try{
      Array.from(stagesList.children).forEach((row, i)=>{
        const sName = row.querySelector('.s-name').value.trim();
        if(!sName) return;
        const sResp = row.querySelector('.s-resp').value.trim();
        const sStart = row.querySelector('.s-start').value;
        const sEnd = row.querySelector('.s-end').value;
        if(parseDate(sEnd) < parseDate(sStart)){
          alert('У этапа "'+sName+'" дата окончания раньше начала — проверьте даты.');
          throw new Error('date order');
        }
        stages.push({ id:'s'+Date.now()+'_'+i, name:sName, responsible:sResp, start:sStart, end:sEnd, done:false, comments:[], history:[] });
      });
    }catch(err){ return; }

    if(modalMode==='subtask'){
      const parent = DATA.find(x=>x.id===modalParentTaskId);
      const sub = { id:'sub'+Date.now(), name, goal, done:false, stages };
      parent.subtasks.push(sub);
      parent.expanded = true;
      saveData(DATA);
      overlay.classList.add('hidden');
      render();
      showToast('Подзадача добавлена');
    } else {
      const task = { id:'t'+Date.now(), name, goal, done:false, expanded:true, stages, subtasks:[] };
      DATA.push(task);
      saveData(DATA);
      overlay.classList.add('hidden');
      render();
    }
  });

  initialLoad();
})();
</script>
</body>
</html>
